[package]
name = "ygo-draw"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Render Yu-Gi-Oh! cards from the command line with typst-ygo"
license = "MIT"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
flate2 = "1.1.9"
indicatif = "0.18.6"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
rand = "0.9.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
tar = "0.4.46"
tempfile = "3.16.0"
typst = "0.15.0"
typst-layout = "0.15.0"
typst-render = "0.15.0"
xz2 = "0.1.7"
