[package]
name = "ygo-draw"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Render Yu-Gi-Oh! cards from the command line with typst-ygo"
license = "MIT"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
flate2 = "1.1.9"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
tar = "0.4.46"
tempfile = "3.16.0"
xz2 = "0.1.7"
